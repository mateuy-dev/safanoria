name: schema

on:
  push:
    paths: [schema/**, tickets/**, safanoria.yaml, .github/workflows/schema.yml]
  pull_request:
    paths: [schema/**, tickets/**, safanoria.yaml, .github/workflows/schema.yml]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - run: python schema/check.py
