name: Safanoria
description: Install the Safanoria CLI (safanoria-cli) and validate the repository's tickets (or run another safanoria-cli command).
branding:
  icon: check-square
  color: green

inputs:
  version:
    description: Safanoria version to install, e.g. 0.1.0 (default the latest release). Pin it so a new release can't change your CI.
    required: false
    default: ""
  args:
    description: Arguments for safanoria-cli.
    required: false
    default: validate
  base-url:
    description: Where releases are downloaded from (tests only).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install safanoria-cli
      if: runner.os != 'Windows'
      shell: bash
      env:
        SAFANORIA_CLI_ONLY: "1"
        SAFANORIA_VERSION: ${{ inputs.version }}
        SAFANORIA_BASE_URL: ${{ inputs.base-url }}
        SAFANORIA_BIN_DIR: ${{ runner.temp }}/safanoria-bin
      run: |
        "${{ github.action_path }}/install.sh"
        echo "$SAFANORIA_BIN_DIR" >> "$GITHUB_PATH"

    - name: Install safanoria-cli
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SAFANORIA_CLI_ONLY: "1"
        SAFANORIA_VERSION: ${{ inputs.version }}
        SAFANORIA_BASE_URL: ${{ inputs.base-url }}
        SAFANORIA_BIN_DIR: ${{ runner.temp }}\safanoria-bin
      run: |
        & "${{ github.action_path }}\install.ps1"
        Add-Content -Path $env:GITHUB_PATH -Value $env:SAFANORIA_BIN_DIR

    # actions/checkout brings one commit of one branch. Tickets on the others count as known ids
    # (a `related` to one created on main meanwhile), so get their tips; a deeper clone is left as it is.
    - name: Fetch the other branches
      shell: bash
      run: |
        depth=""
        if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = true ] && [ "$(git rev-list --count HEAD)" = 1 ]; then
          depth="--depth=1"
        fi
        git fetch --quiet --no-tags $depth origin '+refs/heads/*:refs/remotes/origin/*' ||
          echo "::warning::Safanoria could not fetch the other branches: tickets that are only on them are unknown here"

    - name: safanoria-cli ${{ inputs.args }}
      shell: bash
      run: safanoria-cli ${{ inputs.args }}
